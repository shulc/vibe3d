# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Self-hosted runner has a small disk. Cancel an in-progress run on the same
# ref when a new push lands so two full builds never write GBs side by side.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    # Self-hosted Ubuntu runner. DMD + dub are pre-installed on the host
    # (system dmd via dpkg), so we skip dlang-community/setup-dlang and call
    # `dmd` directly instead of the $DC it would otherwise export.
    runs-on: [self-hosted, Linux]

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history, for ONE consumer: the test census gate (task 0835) needs
        # a baseline, and its baseline is git. With the default one-revision
        # clone there is nothing to compare a tree against but the revision it
        # was checked out from, so the gate could not fail here — measured on
        # this repository, in both shapes this workflow actually runs:
        #
        #   push to main, depth 1   ran=true degraded=FALSE ok=true  ← looked healthy
        #   pull request, depth 1   ran=true degraded=true  ok=true
        #
        # The first is 53 of the last 60 runs, and it is the worse one: `main`
        # exists and `merge-base HEAD main` answers HEAD, so the gate had no way
        # to know it was blind and printed nothing.
        #
        # WHAT THIS COSTS, measured against origin over the runner's network
        # (clone time / .git size):
        #
        #   depth 1 (before)                3.67 s   7.3 MB
        #   fetch-depth: 0 (this)           4.82 s    20 MB     +1.15 s, +13 MB
        #   warm workspace, one-time        5.07 s              ← the unshallow
        #
        # +1.15 s on a ~20-minute job. The two cheaper-looking options were
        # measured and rejected, both for correctness rather than price:
        #
        #   a second `git fetch --depth=1 origin main` (+2.29 s) does not give a
        #   baseline at all — the two shallow tips share no history, `merge-base`
        #   exits 1, and `rev-list base..HEAD` answers 1 instead of the lane
        #   length, i.e. it invents a wrong lane rather than reporting none;
        #
        #   `--filter=blob:none` (6.53 s, 9.5 MB) moves the cost instead of
        #   removing it: the gate reads every blob under source/ + tests/unit at
        #   every lane revision, and on a blobless clone that is a network round
        #   trip each — 109 s for a 21-revision lane, against 0.23 s on this one.
        fetch-depth: 0

    # nfde is now a VENDORED path dep (third_party/nfde, task 0431). Its C lib
    # (nativefiledialog-extended/out/src/libnfd.a) is produced by the package's
    # preBuildCommands (a CMake/Ninja build) INTO THE WORKSPACE, and dub's
    # lflags link it directly. But preBuildCommands only run when dub actually
    # (re)builds the nfde target — and the D-wrapper build is frozen in the
    # runner's persistent ~/.dub/cache. So on a warm-cache run, dub cache-hits
    # nfde, SKIPS the CMake preBuild, and never regenerates out/src/libnfd.a —
    # which actions/checkout's `git clean` wiped from the workspace on this
    # checkout. Result: `ld: cannot find .../out/src/libnfd.a`. Drop the nfde
    # cache so the Build re-runs preBuildCommands and rebuilds the C lib.
    # (Cheap — a small C static lib.)
    #
    # lwo2-writer is a `~master` git dep. dub resolves a branch dep ONCE and
    # freezes it in the runner's persistent package cache — it never re-fetches
    # when upstream master advances, so a lib bump (e.g. the VMAP/VMAD UV work)
    # leaves vibe3d source compiling against a stale frozen copy. Drop it so the
    # Build checks out the current master. (Cheap — pure-D lib, no static build,
    # unlike bindbc-assimp6 which we leave cached here.)
    - name: 'Drop cached nfde + lwo2-writer deps (force preBuild / re-fetch)'
      run: rm -rf ~/.dub/packages/nfde ~/.dub/cache/nfde ~/.dub/packages/lwo2-writer ~/.dub/cache/lwo2-writer || true

    # Placed BEFORE 'Build' on purpose. 'Build' has no continue-on-error, so a
    # step after it is SKIPPED when it fails — and a skipped check is the exact
    # object this task exists to abolish (task 0723): indistinguishable from one
    # that ran and passed. Here it always runs, and it is the cheapest signal in
    # the job.
    #
    # Compile only. The full with-render build fetches a multi-gigabyte renderer
    # checkout, compiles it and bundles runtime libraries, which is why it lives
    # on workflow_dispatch in build.yml and why the configuration was free to rot
    # between two manual runs. The breakage that surfaced this was at D
    # COMPILATION, which needs no built artifacts at all — so compilation comes
    # into the ordinary gate and linking stays on demand. See the script header.
    #
    # Measured: ~3s warm; ~18s / 9.7 MB from a completely empty DUB_HOME (it runs
    # no dependency preBuildCommands, which is what makes both numbers small).
    # timeout-minutes is a tripwire, not a budget: if this ever approaches it,
    # something has started doing the expensive half and must be looked at.
    - name: 'Render config compiles (--config=with-render, compile only)'
      id: render_compile
      continue-on-error: true
      timeout-minutes: 10
      run: tools/ci/render_compile_check.sh

    - name: 'Build'
      # The integration step below runs --no-build, whose guard refuses a
      # ./vibe3d it cannot tie to the sources on disk (task 0678: a gate that
      # measured the previous build came back green while main segfaulted).
      # This step builds the binary the suite will use, so it records the
      # stamp the guard checks.
      run: |
        dub build --compiler=dmd
        ./run_test.d --write-stamp

    # Both test steps use continue-on-error + an id so a failure in one does NOT
    # abort the pipeline: the other test set still runs, the summary still
    # renders, and the disk is still reclaimed. The job is failed at the end by
    # the "Fail if any test failed" gate based on each step's recorded outcome.
    - name: 'Unit tests (embedded unittest blocks)'
      id: unit
      continue-on-error: true
      # nfde's static ctor calls NFD_Init() (GTK), which needs a display;
      # xvfb-run gives the headless runner a virtual one.
      #
      # --config=tests is required, not decorative (task 0706): the `tests`
      # configuration is the only one whose sourcePaths include tests/unit/,
      # where module unittests extracted out of source/ live. A bare `dub test`
      # builds the DEFAULT configuration (`modeling`) and passes over the
      # smaller set without reporting anything unusual. The step log names the
      # binary it ran (`vibe3d-test-tests`) and prints druntime's
      # `N modules passed unittests` count — check those if this ever looks
      # suspiciously cheap.
      #
      # VIBE3D_CENSUS_BRANCH_POINT hands the census gate the one thing this
      # checkout cannot work out for itself: where the work being tested began
      # (task 0850). On a push that is the tip main had before it — everything
      # in `before..HEAD` is what this run is judging. On a pull request it is
      # the base the PR is proposed against; the checkout is a merge commit, so
      # without this there is neither `main` nor `origin/main` to branch from.
      # The gate walks from here to HEAD and takes the running maximum, so a
      # loss inside the range cannot be paid for by a gain elsewhere in it.
      #
      # If this line is deleted the gate does not go quiet, it goes RED: it
      # refuses to report a pass under GITHUB_ACTIONS when its only baseline is
      # HEAD. Same if `fetch-depth: 0` above is dropped — the revision named
      # here then does not resolve, which it says in as many words. A build with
      # genuinely no baseline (a fork, a first commit) is spelled `none`.
      env:
        VIBE3D_CENSUS_BRANCH_POINT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: xvfb-run -a dub test --config=tests --compiler=dmd

    - name: 'Integration tests (HTTP suite via run_all.d)'
      id: integration
      continue-on-error: true
      # run_all.d --only unit fans out to ./run_test.d. --no-build reuses the
      # ./vibe3d binary from the Build step. The whole thing runs under one
      # Xvfb display so each spawned `vibe3d --test` gets a GL context.
      # -j is CAPPED at 4 (host physical cores), NOT $(nproc). The runner is a
      # QEMU VM that reports 16 vCPUs, but the physical host (hamster) is a
      # 4-core / 8-thread Intel i3-10100 and the VM has 7.7 GiB RAM. RAM is no
      # longer the constraint — run_test.d builds the project into a shared lib
      # once (~1.6 GiB, sequential) and links each worker's tests against it
      # (~0.25 GiB/worker), so even -j16 fits. But -j$(nproc)=16 oversubscribes
      # the host CPU 2-4x, and under that scheduling contention the per-worker
      # `vibe3d --test` GL boots miss run_test.d's HTTP come-up timeout:
      # 2026-07-22 a -j16 run had 14/16 servers start but 2 time out, failing the
      # whole run (no crash, no assertion — pure overload). -j4 = one worker per
      # host physical core boots reliably. History: -j was pinned to 1 on the old
      # ~4 GiB runner (dmd -i peaked ~1.6 GiB; -j4 OOM-killed dmd, 2026-06-06)
      # before the shared-lib change removed the RAM scaling; the cap is now CPU-
      # bound, not RAM-bound. Raise toward the host's thread count if it grows.
      # tee the output so the next step can build a pass/fail table; pipefail
      # keeps the test exit code (not tee's) as the step result.
      # RUN_ALL_EXCLUDE quarantines test_acen_pin_characterization ON CI ONLY.
      # It is a golden-value characterization test pinning ACEN pin/gesture drag
      # results to a 1e-4 tolerance (see the test's own header: "do not loosen").
      # 1e-4 holds within one machine but NOT across machines: the self-hosted
      # runner's float output for the drag accumulation drifts ~1e-4 from the
      # golden captured on a dev box (got -0.140917 vs want -0.140815 on
      # move_origin_afterDrag). It passes locally on every dev machine; only the
      # runner diverges, and the divergence appeared without any change to the
      # test, golden, or transform math — i.e. a runner toolchain (dmd/libc)
      # shift, not a code regression. Quarantined here (NOT loosened — the local
      # gate keeps the strict check) until the runner's D toolchain is pinned to
      # match the golden. See doc/tasks/.../0420-ci-fix-acen-appimage.md.
      env:
        RUN_ALL_EXCLUDE: test_acen_pin_characterization
      run: |
        set -o pipefail
        xvfb-run -a ./run_all.d --only unit --no-build -j 4 2>&1 | tee integration.log

    - name: 'Test results summary'
      # Parse run_test.d's per-test lines ("PASS  [wN]  name" / "FAIL ...") into a
      # GitHub job summary table, shown on the run's page. always() so it renders
      # on failure too. Output is plain (no tty → no ANSI) so fields split cleanly.
      if: always()
      run: |
        {
          echo "## Test results"
          echo ""
          echo "- Render config compiles (\`--config=with-render\`, compile only): **${{ steps.render_compile.outcome }}**"
          echo "- Embedded unit tests (\`dub test --config=tests\`): **${{ steps.unit.outcome }}**"
          echo ""
          echo "### Integration suite"
          echo ""
          if [ -f integration.log ]; then
            echo "| | Result | Test |"
            echo "|---|---|---|"
            awk '
              /^[[:space:]]*(PASS|FAIL)[[:space:]]/ {
                res=$1
                test=($2 ~ /^\[w/) ? $3 : $2
                if (test=="") next
                icon=(res=="PASS")?"✅":"❌"
                print "| "icon" | "res" | "test" |"
              }
            ' integration.log | sort -t'|' -k3,3 -k4,4 -u
            p=$(awk '/^[[:space:]]*PASS[[:space:]]/{n++} END{print n+0}' integration.log)
            f=$(awk '/^[[:space:]]*FAIL[[:space:]]/{n++} END{print n+0}' integration.log)
            echo ""
            echo "**Passed: ${p} · Failed: ${f}**"
          else
            echo "_integration suite did not run (no integration.log)_"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 'Build perf-count binary'
      # Debug + PerfProbe, dmd-buildable (task 0200 — perf-count buildType in
      # dub.json). Overwrites ./vibe3d — safe now that the integration step
      # above already ran against the modeling binary from the top-level
      # 'Build' step. No continue-on-error: a broken perf-count build should
      # hard-fail the job immediately, same as the top-level 'Build' step.
      run: dub build --build=perf-count --compiler=dmd

    - name: 'Frame scenario invariants (frames --ci)'
      id: frames
      continue-on-error: true
      # --no-build reuses the perf-count ./vibe3d just built. --ci downgrades
      # F-I4 (GC) to RECORDED/non-gating for every scenario (host-flaky —
      # see doc/frame_scenarios_ci_plan.md) and implies --no-absolute (the
      # p99/hitch budgets are baseline-host-relative, meaningless here).
      # --n 64 keeps the run inside the 4 GiB / -j1 self-hosted runner's
      # budget (measured ~10s locally). set -o pipefail keeps run.d's exit
      # code (not tee's) as the step result.
      run: |
        set -o pipefail
        xvfb-run -a rdmd tools/perf/run.d frames --no-build --ci --n 64 2>&1 | tee frames.log

    - name: 'Frame scenario summary'
      # Surfaces the frames --ci verdict in the job summary. always() so it
      # renders even if the step above failed (a red frames-invariants run
      # is exactly when this is most useful to see without digging into logs).
      if: always()
      run: |
        {
          echo ""
          echo "### Frame scenario invariants (\`frames --ci\`)"
          echo ""
          echo "- Result: **${{ steps.frames.outcome }}**"
          if [ -f frames.log ]; then
            echo ""
            echo '```'
            tail -n 25 frames.log
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 'Reclaim disk (bound dub build cache)'
      # dub caches every build under a content hash in ~/.dub/cache/vibe3d and
      # never evicts old ones, so it grows unbounded across commits and fills the
      # small VM disk. Drop it (next run rebuilds from scratch, ~40s) plus any
      # stray test scratch. `always()` so a failed/cancelled run still cleans up.
      if: always()
      run: |
        dub clean || true
        rm -rf ~/.dub/cache/vibe3d /tmp/vibe3d-tests-* || true
        df -h / | tail -1

    - name: 'Fail if any test failed'
      # The test steps swallow their own failure (continue-on-error) so the
      # summary/cleanup always run; this gate turns the job red afterwards.
      if: always()
      run: |
        echo "render_compile=${{ steps.render_compile.outcome }} unit=${{ steps.unit.outcome }} integration=${{ steps.integration.outcome }} frames=${{ steps.frames.outcome }}"
        [ "${{ steps.render_compile.outcome }}" = "success" ] && \
        [ "${{ steps.unit.outcome }}" = "success" ] && \
        [ "${{ steps.integration.outcome }}" = "success" ] && \
        [ "${{ steps.frames.outcome }}" = "success" ]
