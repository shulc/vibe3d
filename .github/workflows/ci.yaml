# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  # actions: read — task 2040's nightly-freshness step below asks the API for
  # the age of the last nightly-perf run (and, since task 2580, the age and
  # drift of the last SCHEDULE-triggered run specifically); nothing else in
  # this job needs it.
  actions: read

# Self-hosted runner has a small disk. Cancel an in-progress run on the same
# ref when a new push lands so two full builds never write GBs side by side.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    # Self-hosted Ubuntu runner. DMD + dub are pre-installed on the host
    # (system dmd via dpkg), so we skip dlang-community/setup-dlang and call
    # `dmd` directly instead of the $DC it would otherwise export.
    runs-on: [self-hosted, Linux, ci-vm]

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history, for ONE consumer: the test census gate (task 0835) needs
        # a baseline, and its baseline is git. With the default one-revision
        # clone there is nothing to compare a tree against but the revision it
        # was checked out from, so the gate could not fail here — measured on
        # this repository, in both shapes this workflow actually runs:
        #
        #   push to main, depth 1   ran=true degraded=FALSE ok=true  ← looked healthy
        #   pull request, depth 1   ran=true degraded=true  ok=true
        #
        # The first is 53 of the last 60 runs, and it is the worse one: `main`
        # exists and `merge-base HEAD main` answers HEAD, so the gate had no way
        # to know it was blind and printed nothing.
        #
        # WHAT THIS COSTS, measured against origin over the runner's network
        # (clone time / .git size):
        #
        #   depth 1 (before)                3.67 s   7.3 MB
        #   fetch-depth: 0 (this)           4.82 s    20 MB     +1.15 s, +13 MB
        #   warm workspace, one-time        5.07 s              ← the unshallow
        #
        # +1.15 s on a ~20-minute job. The two cheaper-looking options were
        # measured and rejected, both for correctness rather than price:
        #
        #   a second `git fetch --depth=1 origin main` (+2.29 s) does not give a
        #   baseline at all — the two shallow tips share no history, `merge-base`
        #   exits 1, and `rev-list base..HEAD` answers 1 instead of the lane
        #   length, i.e. it invents a wrong lane rather than reporting none;
        #
        #   `--filter=blob:none` (6.53 s, 9.5 MB) moves the cost instead of
        #   removing it: the gate reads every blob under source/ + tests/unit at
        #   every lane revision, and on a blobless clone that is a network round
        #   trip each — 109 s for a 21-revision lane, against 0.23 s on this one.
        fetch-depth: 0

    # task 2040 — a nightly-perf run that never happened reads identically to
    # one that ran and failed: the run list's "latest" entry is just old, and
    # nothing says so on its own. `schedule` cron delivery is GitHub's own
    # documented best-effort, and it CAN silently drop a night under load —
    # measured here: perf.yaml's cron is '30 0 * * *' and real deliveries
    # have landed anywhere from 94 minutes to (once) nearly ten hours late.
    # A watcher for that has to live OUTSIDE the run that can go missing, so
    # it cannot itself be `schedule`-triggered (that just relocates the same
    # best-effort delivery, see the tool's own header for the two rejected
    # alternatives). This job is push/pull_request-triggered — webhook
    # delivery, not cron — and given this repository's commit cadence it runs
    # many times a day, which is why it is the chosen home.
    #
    # continue-on-error + always()-summary, same shape as render_compile below:
    # a red step here must not skip anything after it, and the final gate
    # aggregates outcomes rather than depending on step ordering. GH_TOKEN
    # inherits into `gh`'s own environment; the step's environment is
    # otherwise UNMODIFIED — no proxy override, no `--noproxy`, see
    # tools/ci/nightly_freshness.d's own header for why a bypass here is
    # exactly the mistake that made three other lanes red for a day.
    #
    # TASK 2580 — same step, a SECOND term. "Figures are fresh" (above) is
    # not "the schedule is delivering": a manual `workflow_dispatch` resets
    # the freshness clock but not a genuinely broken cron, and that is
    # exactly what hid a missed night for a day on 2026-08-28 (three manual
    # dispatches in one afternoon). The tool now also checks the age of the
    # last SCHEDULE-triggered run alone (its own threshold — a workflow_
    # dispatch cannot reset it) and prints median/max delivery drift.
    #
    # GATE OR REPORT: DECIDED BY THE OWNER 2026-08-28 — REPORT, for BOTH
    # terms. Neither the figure-freshness term (task 2040) nor the schedule-
    # health term (task 2580) appears in the final aggregate gate any more;
    # both are printed here and both carry their own summary line below.
    # The reasoning is recorded at the gate block itself. What follows is the
    # mechanical description that made the choice a real one: Mechanically, this
    # step's own exit code IS what the final aggregate gate below reads
    # (`steps.nightly_freshness.outcome`) — there is no free middle ground of
    # "this step goes red but the build stays green", so the honest choice is
    # between two states, not three:
    #   - default (no flag): only term 1 (figure freshness) drives this
    #     step's exit code, exactly as task 2040 shipped it. A stopped
    #     schedule is still ALWAYS printed (this step's own log) and ALWAYS
    #     surfaced as its own line in the job summary below (piped through
    #     `tee` so the summary step can read it back) — visible to anyone who
    #     opens the summary, without failing anyone's unrelated PR.
    #   - `--gate-schedule-health` added to the `run:` line: term 2 also
    #     drives this step's exit code, which — because of the wiring above —
    #     means a stopped schedule then fails the WHOLE job for every push/PR
    #     until it is fixed. That is a real cost (task 2580's own words: "не
    #     чинится тем, кто открыл PR, и красить ему сборку значит наказывать
    #     не того").
    # The recommendation that stood here was to keep the second term as a
    # report; the owner extended that to the first term as well, so the
    # asymmetry this comment used to describe is gone. `--gate-schedule-health`
    # still exists and still works; nothing passes it today.
    # 2026-08-30 — THREE LANES AND A THIRD TERM. Task 2580 closed half its own
    # hole: it asked "is the schedule delivering", and it asked it of
    # `nightly-perf` alone. Both halves cost a measured outage.
    #
    #   * THE LANE HALF. `nightly-tsan` ran its ThreadSanitizer tests for the
    #     last time on 2026-08-25. Nothing here was looking at it. The two
    #     other scheduled nightlies (`tsan.yaml`, `sanitizer.yaml` 19:00) now
    #     get the same three terms as `perf.yaml`, each with its own
    #     `--cron-target-utc` — nothing in the tool was ever perf-specific.
    #
    # THE TSAN TARGET MOVED 17:00 -> 04:30 on 2026-08-30 (owner's call; see
    # `.github/workflows/tsan.yaml`). It is changed HERE too because the drift
    # term is measured against the target this line declares, and a stale one
    # measures nothing real. Two consequences worth knowing before reading the
    # next fortnight's numbers:
    #   * the historical deliveries in the window were all evening ones, so
    #     against a 04:30 target they now read as +12h..+15h until the sample
    #     rolls over. That is arithmetic, not a regression.
    #   * it makes the figure TRUSTWORTHY for this lane for the first time.
    #     `scheduleDriftMinutes` compares time-of-day, so a target the
    #     deliveries wrap past midnight from produces large negative drifts and
    #     a meaningless median — which is exactly what the tool's own doc
    #     comment warns about for "the two evening lanes". A 04:30 target with
    #     acceptance closing at 19:30 cannot wrap.
    #   * THE TERM HALF, and it is the one that matters. Terms 1 and 2 were
    #     BOTH GREEN throughout those five nights: the cron delivered, the
    #     runs existed, every one of them was `event: schedule`. They just
    #     refused at their own window guard before a single test ran. Adding
    #     two more lanes to terms 1 and 2 would have added two more greens
    #     that CANNOT come out differently on the one failure on record. Term
    #     3 asks the discriminating question — how long since a scheduled run
    #     CONCLUDED success — and reddens on exactly that state.
    #
    # REPORT, NOT GATE, for all three terms on all three lanes: unchanged
    # owner decision from 2026-08-28 (see the block above). This step's
    # outcome word does not appear in the final aggregate gate; every lane's
    # verdict is surfaced as its own summary line below instead. `|| true` per
    # lane so one lane's fetch failure cannot hide the other two's verdicts —
    # the verdicts themselves are read out of the log, not out of exit codes.
    - name: 'Nightly lane freshness: perf + tsan + sanitizer (tasks 2040/2580 + term 3)'
      id: nightly_freshness
      continue-on-error: true
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -o pipefail
        : > nightly_freshness_output.log
        worst=0
        for lane in "perf.yaml|nightly-perf|00:30" \
                    "tsan.yaml|nightly-tsan|04:30" \
                    "sanitizer.yaml|nightly-sanitizer|19:00"; do
          wf=${lane%%|*}; rest=${lane#*|}; label=${rest%%|*}; target=${rest##*|}
          echo "--- $label ($wf, cron target $target UTC)" \
            | tee -a nightly_freshness_output.log
          rc=0
          rdmd tools/ci/nightly_freshness.d \
            --workflow "$wf" --workflow-label "$label" --cron-target-utc "$target" \
            2>&1 | tee -a nightly_freshness_output.log || rc=$?
          # Keep the WORST code across lanes so this step's outcome word still
          # means something, while one lane's failure never stops the others
          # from being asked. 2 ("could not tell") outranks 1 ("stale") — the
          # tool's own discipline: "I could not check" must never read as
          # either a green or a stale verdict.
          # An `if`, not `[ ] && …`: this job's default shell is `bash -e`, and
          # a bare test that evaluates false is a failing command at the end of
          # the loop body — it would abort the loop after the FIRST healthy
          # lane and never look at the other two.
          if [ "$rc" -gt "$worst" ]; then worst=$rc; fi
        done
        exit $worst

    # nfde is now a VENDORED path dep (third_party/nfde, task 0431). Its C lib
    # (nativefiledialog-extended/out/src/libnfd.a) is produced by the package's
    # preBuildCommands (a CMake/Ninja build) INTO THE WORKSPACE, and dub's
    # lflags link it directly. But preBuildCommands only run when dub actually
    # (re)builds the nfde target — and the D-wrapper build is frozen in the
    # runner's persistent ~/.dub/cache. So on a warm-cache run, dub cache-hits
    # nfde, SKIPS the CMake preBuild, and never regenerates out/src/libnfd.a —
    # which actions/checkout's `git clean` wiped from the workspace on this
    # checkout. Result: `ld: cannot find .../out/src/libnfd.a`. Drop the nfde
    # cache so the Build re-runs preBuildCommands and rebuilds the C lib.
    # (Cheap — a small C static lib.)
    #
    # lwo2-writer is a `~master` git dep. dub resolves a branch dep ONCE and
    # freezes it in the runner's persistent package cache — it never re-fetches
    # when upstream master advances, so a lib bump (e.g. the VMAP/VMAD UV work)
    # leaves vibe3d source compiling against a stale frozen copy. Drop it so the
    # Build checks out the current master. (Cheap — pure-D lib, no static build,
    # unlike bindbc-assimp6 which we leave cached here.)
    - name: 'Drop cached nfde + lwo2-writer deps (force preBuild / re-fetch)'
      run: rm -rf ~/.dub/packages/nfde ~/.dub/cache/nfde ~/.dub/packages/lwo2-writer ~/.dub/cache/lwo2-writer || true

    # Placed BEFORE 'Build' on purpose. 'Build' has no continue-on-error, so a
    # step after it is SKIPPED when it fails — and a skipped check is the exact
    # object this task exists to abolish (task 0723): indistinguishable from one
    # that ran and passed. Here it always runs, and it is the cheapest signal in
    # the job.
    #
    # Compile only. The full with-render build fetches a multi-gigabyte renderer
    # checkout, compiles it and bundles runtime libraries, which is why it lives
    # on workflow_dispatch in build.yml and why the configuration was free to rot
    # between two manual runs. The breakage that surfaced this was at D
    # COMPILATION, which needs no built artifacts at all — so compilation comes
    # into the ordinary gate and linking stays on demand. See the script header.
    #
    # Measured: ~3s warm; ~18s / 9.7 MB from a completely empty DUB_HOME (it runs
    # no dependency preBuildCommands, which is what makes both numbers small).
    # timeout-minutes is a tripwire, not a budget: if this ever approaches it,
    # something has started doing the expensive half and must be looked at.
    - name: 'Render config compiles (--config=with-render, compile only)'
      id: render_compile
      continue-on-error: true
      timeout-minutes: 10
      run: tools/ci/render_compile_check.sh

    - name: 'Build'
      # The integration step below runs --no-build, whose guard refuses a
      # ./vibe3d it cannot tie to the sources on disk (task 0678: a gate that
      # measured the previous build came back green while main segfaulted).
      # This step builds the binary the suite will use, so it records the
      # stamp the guard checks.
      run: |
        dub build --compiler=dmd
        ./run_test.d --write-stamp

    # Both test steps use continue-on-error + an id so a failure in one does NOT
    # abort the pipeline: the other test set still runs, the summary still
    # renders, and the disk is still reclaimed. The job is failed at the end by
    # the "Fail if any test failed" gate based on each step's recorded outcome.
    - name: 'Unit tests (embedded unittest blocks)'
      id: unit
      continue-on-error: true
      # nfde's static ctor calls NFD_Init() (GTK), which needs a display;
      # xvfb-run gives the headless runner a virtual one.
      #
      # --config=tests is required, not decorative (task 0706): the `tests`
      # configuration is the only one whose sourcePaths include tests/unit/,
      # where module unittests extracted out of source/ live. A bare `dub test`
      # builds the DEFAULT configuration (`modeling`) and passes over the
      # smaller set without reporting anything unusual. The step log names the
      # binary it ran (`vibe3d-test-tests`) and prints druntime's
      # `N modules passed unittests` count — check those if this ever looks
      # suspiciously cheap.
      #
      # VIBE3D_CENSUS_BRANCH_POINT hands the census gate the one thing this
      # checkout cannot work out for itself: where the work being tested began
      # (task 0850). On a push that is the tip main had before it — everything
      # in `before..HEAD` is what this run is judging. On a pull request it is
      # the base the PR is proposed against; the checkout is a merge commit, so
      # without this there is neither `main` nor `origin/main` to branch from.
      # The gate walks from here to HEAD and takes the running maximum, so a
      # loss inside the range cannot be paid for by a gain elsewhere in it.
      #
      # If this line is deleted the gate does not go quiet, it goes RED: it
      # refuses to report a pass under GITHUB_ACTIONS when its only baseline is
      # HEAD. Same if `fetch-depth: 0` above is dropped — the revision named
      # here then does not resolve, which it says in as many words. A build with
      # genuinely no baseline (a fork, a first commit) is spelled `none`.
      env:
        VIBE3D_CENSUS_BRANCH_POINT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: xvfb-run -a dub test --config=tests --compiler=dmd

    - name: 'Integration tests (HTTP suite via run_all.d)'
      id: integration
      continue-on-error: true
      # run_all.d --only unit fans out to ./run_test.d. --no-build reuses the
      # ./vibe3d binary from the Build step. The whole thing runs under one
      # Xvfb display so each spawned `vibe3d --test` gets a GL context.
      # -j is CAPPED at 4 (host physical cores), NOT $(nproc). The runner is a
      # QEMU VM that reports 16 vCPUs, but the physical host (hamster) is a
      # 4-core / 8-thread Intel i3-10100 and the VM has 7.7 GiB RAM. RAM is no
      # longer the constraint — run_test.d builds the project into a shared lib
      # once (~1.6 GiB, sequential) and links each worker's tests against it
      # (~0.25 GiB/worker), so even -j16 fits. But -j$(nproc)=16 oversubscribes
      # the host CPU 2-4x, and under that scheduling contention the per-worker
      # `vibe3d --test` GL boots miss run_test.d's HTTP come-up timeout:
      # 2026-07-22 a -j16 run had 14/16 servers start but 2 time out, failing the
      # whole run (no crash, no assertion — pure overload). -j4 = one worker per
      # host physical core boots reliably. History: -j was pinned to 1 on the old
      # ~4 GiB runner (dmd -i peaked ~1.6 GiB; -j4 OOM-killed dmd, 2026-06-06)
      # before the shared-lib change removed the RAM scaling; the cap is now CPU-
      # bound, not RAM-bound. Raise toward the host's thread count if it grows.
      # tee the output so the next step can build a pass/fail table; pipefail
      # keeps the test exit code (not tee's) as the step result.
      # RUN_ALL_EXCLUDE quarantines test_acen_pin_characterization ON CI ONLY.
      # It is a golden-value characterization test pinning ACEN pin/gesture drag
      # results to a 1e-4 tolerance (see the test's own header: "do not loosen").
      # 1e-4 holds within one machine but NOT across machines: the self-hosted
      # runner's float output for the drag accumulation drifts ~1e-4 from the
      # golden captured on a dev box (got -0.140917 vs want -0.140815 on
      # move_origin_afterDrag). It passes locally on every dev machine; only the
      # runner diverges, and the divergence appeared without any change to the
      # test, golden, or transform math — i.e. a runner toolchain (dmd/libc)
      # shift, not a code regression. Quarantined here (NOT loosened — the local
      # gate keeps the strict check) until the runner's D toolchain is pinned to
      # match the golden. See doc/tasks/.../0420-ci-fix-acen-appimage.md.
      env:
        RUN_ALL_EXCLUDE: test_acen_pin_characterization
      run: |
        set -o pipefail
        xvfb-run -a ./run_all.d --only unit --no-build -j 4 2>&1 | tee integration.log

    - name: 'Test results summary'
      # Parse run_test.d's per-test lines ("PASS  [wN]  name" / "FAIL ..." /
      # "TIMEOUT ...") into a GitHub job summary table, shown on the run's page.
      # always() so it renders on failure too. Output is plain (no tty → no ANSI)
      # so fields split cleanly.
      #
      # TIMEOUT is run_test.d's third status (task 1420): the test did not fail,
      # it never finished and had its process tree killed at the per-test cap.
      # It is matched HERE and counted in its OWN column — counted once, never
      # also as a FAIL. Dropping it from the pattern would make a hung test
      # vanish from this table entirely, which is the failure mode the task was
      # written about; folding it into FAIL would hide the one distinction that
      # tells you a hang from an assertion. The job's red/green does not come
      # from these counts at all — it comes from the step outcome, and
      # run_test.d exits non-zero on a timeout.
      if: always()
      run: |
        {
          echo "## Test results"
          echo ""
          echo "- Nightly lane freshness (2040 / 2580 / term 3): **${{ steps.nightly_freshness.outcome }}**"
          # All three terms are report-only (see that step's own comment), so
          # NONE of them shows up in the outcome word above — surface every
          # line the step printed, EXPLICITLY, every run and not only on
          # request. A number that only prints when someone goes looking is
          # the exact shape task 2040 was written to reject, and looking at
          # only one of three lanes is the shape 2026-08-30 added.
          #
          # `grep -m1` per lane is gone deliberately: with three lanes in one
          # log it would report the first lane's verdict three times. The log
          # carries a `--- <label>` header per lane, so it is read whole.
          if [ -f nightly_freshness_output.log ]; then
            while IFS= read -r L; do
              case "$L" in
                ---*)                echo "  - **${L#--- }**" ;;
                *"CRON STOPPED"*)    echo "    - ⚠️ \`${L}\`" ;;
                *"LANE SILENT"*)     echo "    - ⚠️ \`${L}\`" ;;
                *MISSING*)           echo "    - ⚠️ \`${L}\`" ;;
                # "could not tell" is its own state and must never be silently
                # absent from the summary — that is the disguise task 2040
                # exists to remove, one level up. Verified against a stub log
                # in which one of the three lanes exits 2.
                *"could not "*|*"NO recorded"*|*"NO successful"*|*"no schedule-triggered run found"*)
                                     echo "    - ⚠️ \`${L}\`" ;;
                *"schedule drift"*)  echo "    - \`${L}\`" ;;
                *"— fresh."*|*"— delivering."*|*"— measuring."*)
                                     echo "    - \`${L}\`" ;;
              esac
            done < nightly_freshness_output.log
          fi
          echo "- Render config compiles (\`--config=with-render\`, compile only): **${{ steps.render_compile.outcome }}**"
          echo "- Embedded unit tests (\`dub test --config=tests\`): **${{ steps.unit.outcome }}**"
          echo ""
          echo "### Integration suite"
          echo ""
          if [ -f integration.log ]; then
            echo "| | Result | Test |"
            echo "|---|---|---|"
            awk '
              /^[[:space:]]*(PASS|FAIL|TIMEOUT)[[:space:]]/ {
                res=$1
                test=($2 ~ /^\[w/) ? $3 : $2
                if (test=="") next
                icon=(res=="PASS")?"✅":((res=="TIMEOUT")?"⏱️":"❌")
                print "| "icon" | "res" | "test" |"
              }
            ' integration.log | sort -t'|' -k3,3 -k4,4 -u
            p=$(awk '/^[[:space:]]*PASS[[:space:]]/{n++} END{print n+0}' integration.log)
            f=$(awk '/^[[:space:]]*FAIL[[:space:]]/{n++} END{print n+0}' integration.log)
            t=$(awk '/^[[:space:]]*TIMEOUT[[:space:]]/{n++} END{print n+0}' integration.log)
            echo ""
            echo "**Passed: ${p} · Failed: ${f} · Timed out: ${t}**"
            if [ "${t}" -gt 0 ]; then
              echo ""
              echo "> ⏱️ A timed-out test HUNG — it was killed at run_test.d's per-test cap, it did not fail an assertion. Look for a parked thread, not a wrong value."
            fi
          else
            echo "_integration suite did not run (no integration.log)_"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 'Build perf-count binary'
      # Debug + PerfProbe, dmd-buildable (task 0200 — perf-count buildType in
      # dub.json). Overwrites ./vibe3d — safe now that the integration step
      # above already ran against the modeling binary from the top-level
      # 'Build' step. No continue-on-error: a broken perf-count build should
      # hard-fail the job immediately, same as the top-level 'Build' step.
      run: dub build --build=perf-count --compiler=dmd

    - name: 'Frame scenario invariants (frames --ci)'
      id: frames
      continue-on-error: true
      # --no-build reuses the perf-count ./vibe3d just built. --ci downgrades
      # F-I4 (GC) to RECORDED/non-gating for every scenario (host-flaky —
      # see doc/frame_scenarios_ci_plan.md) and implies --no-absolute (the
      # p99/hitch budgets are baseline-host-relative, meaningless here).
      # --n 64 keeps the run inside the 4 GiB / -j1 self-hosted runner's
      # budget (measured ~10s locally). set -o pipefail keeps run.d's exit
      # code (not tee's) as the step result.
      run: |
        set -o pipefail
        xvfb-run -a rdmd tools/perf/run.d frames --no-build --ci --n 64 2>&1 | tee frames.log

    - name: 'Frame scenario summary'
      # Surfaces the frames --ci verdict in the job summary. always() so it
      # renders even if the step above failed (a red frames-invariants run
      # is exactly when this is most useful to see without digging into logs).
      if: always()
      run: |
        {
          echo ""
          echo "### Frame scenario invariants (\`frames --ci\`)"
          echo ""
          echo "- Result: **${{ steps.frames.outcome }}**"
          if [ -f frames.log ]; then
            echo ""
            echo '```'
            tail -n 25 frames.log
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 'Reclaim disk (bound dub build cache)'
      # dub caches every build under a content hash in ~/.dub/cache/vibe3d and
      # never evicts old ones, so it grows unbounded across commits and fills the
      # small VM disk. Drop it (next run rebuilds from scratch, ~40s) plus any
      # stray test scratch. `always()` so a failed/cancelled run still cleans up.
      if: always()
      run: |
        dub clean || true
        rm -rf ~/.dub/cache/vibe3d /tmp/vibe3d-tests-* || true
        df -h / | tail -1

    - name: 'Fail if any test failed'
      # The test steps swallow their own failure (continue-on-error) so the
      # summary/cleanup always run; this gate turns the job red afterwards.
      if: always()
      run: |
        echo "nightly_freshness=${{ steps.nightly_freshness.outcome }} (REPORT ONLY, does not gate) render_compile=${{ steps.render_compile.outcome }} unit=${{ steps.unit.outcome }} integration=${{ steps.integration.outcome }} frames=${{ steps.frames.outcome }}"
        # OWNER DECISION 2026-08-28 — the nightly-perf step is REPORT ONLY, both
        # of its terms. It is printed above and carries its own summary lines,
        # and it no longer appears in the conjunction below.
        #
        # Task 2040 gated deliberately, and the reason was sound at the time: a
        # missed night read identically to a failed one, and a line nobody opens
        # is how that went unnoticed for a day. What changed is that task 2580
        # added an UNCONDITIONAL summary line for both terms, so "report" stopped
        # meaning "silent" — which was the whole argument for gating.
        #
        # What it was costing: the nightly runs on a workstation, so a machine
        # that was off overnight reddened every unrelated pull request the next
        # morning. That punishes whoever opened the PR for something they cannot
        # fix and did not cause, and a gate people learn to route around is worse
        # than no gate.
        [ "${{ steps.render_compile.outcome }}" = "success" ] && \
        [ "${{ steps.unit.outcome }}" = "success" ] && \
        [ "${{ steps.integration.outcome }}" = "success" ] && \
        [ "${{ steps.frames.outcome }}" = "success" ]
