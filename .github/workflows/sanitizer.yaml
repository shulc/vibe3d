name: nightly-sanitizer

# The instrumented nightly (task 1410). Owner's goal, verbatim: crashes found
# HERE rather than by a user. It builds vibe3d with checks on, runs the
# ORDINARY (non-perf) tests against it, then points the existing fuzzer at the
# instrumented binary for whatever budget is left.
#
# THE SHIPPED RELEASE IS NOT CHANGED BY ANY OF THIS, and the first two steps
# prove it rather than assert it — see `lane.d preflight` (structural read of
# `dub describe --build=release`, with --compiler set) and
# `lane.d preflight-release` (a `strings` scan of the real release binary for
# the fault injector). Passing --compiler is what makes the first one able to
# fail: `dub describe --build=release` with no --compiler defaults to dmd and
# DROPS every dflags-ldc entry, so the naive form passes on a config carrying
# --fsanitize=address. Measured, both ways.
#
# WHY NOT NEXT TO THE PERF NIGHTLY
# --------------------------------
# nightly-perf runs at 00:30 UTC on this same runner and its day-over-day
# --vs-last gate is the one perf signal that still means something. Two
# defences, and deliberately NOT a shared concurrency group: a shared group
# would let a 180-minute overrun here push the perf run hours later into a
# different thermal and desktop-activity regime, which poisons exactly that
# comparison instead of protecting it. So: a separate schedule that starts
# five and a half hours earlier, and a HARD STOP (`timeout-minutes`) that ends
# this job an hour before perf begins even in the worst case.
#
#   19:00 UTC start + 270 min cap  ⇒  latest possible end 23:30 UTC
#   00:30 UTC  perf starts
#
# WHY EVERY STEP CARRIES xvfb-run
# -------------------------------
# This runner is a hardware-GL workstation inside the owner's graphical
# session, and the perf lane uses DISPLAY=:0 on purpose. Measured on this
# project: an editor boot costs ~12.5 GiB of RSS on hardware GL against
# ~1.12 GiB under software GL, and an eight-way run once took 44.7 of 62 GiB
# and was OOM-killed. `lane.d preflight` FAILS if DISPLAY is :0.

on:
  schedule:
    - cron: '0 19 * * *'   # 22:00 MSK; perf is 00:30 UTC, build.yml 03:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly-sanitizer
  cancel-in-progress: false

env:
  # The instrumented builds must not write into the shared ~/.dub: it holds
  # LDC-built archives that break the dmd test-link path with
  # undefined-druntime-symbol errors in third-party packages. lane.d FAILS if
  # this is unset rather than quietly using the shared cache.
  VIBE3D_SAN_DUB_HOME: ${{ github.workspace }}/.dub-sanitizer
  # DISPLAY is CLEARED for every step, and that is what makes the preflight's
  # ":0 is forbidden" check meaningful rather than self-defeating.
  #
  # This runner is a user service inside the owner's graphical session, so it
  # INHERITS DISPLAY=:0. The lane's contract is that every step runs under
  # `xvfb-run -a`, which allocates its own display -- but `lane.d preflight`
  # runs before any of them and saw the inherited :0, so it refused the job it
  # was written to protect. Measured on the first forced run, 2026-08-19:
  # "FAIL: DISPLAY=:0 -- this lane must run every step under ... xvfb-run".
  #
  # Clearing it here is not loosening the check. With DISPLAY empty, `xvfb-run
  # -a` still allocates and exports its own, so every step that boots the
  # editor is on software GL as intended; and the preflight now fails only if
  # something RE-INTRODUCES :0, which is the condition it exists to catch. A
  # hardware-GL boot costs ~12.5 GiB of RSS against ~1.12 GiB, and this lane's
  # instrumented builds would OOM the owner's workstation on the first one.
  DISPLAY: ''
  # Task 1412 — the day --gate=record started being the answer for the coverage
  # gate. A LITERAL, on purpose: coverage_gate.py reddens once this is more than
  # RECORD_MAX_DAYS (14) old, so "record" cannot quietly become "forever" by
  # nobody remembering. It is not the only thing standing between record and
  # forever any more (the infrastructure clauses redden from day one either
  # way) — it is the cheap insurance on top.
  COVERAGE_GATE_SINCE: '2026-08-19'
  # MEASURED, not guessed — the plan wrote `-j 8` while its own trap list said
  # the number had to be measured. Under ASan, on software GL, one instance
  # peaks at 453 MB VmHWM (uninstrumented: 128 MB, so ~3.6x). At -j 6 that is
  # ~2.7 GiB of instances on a 62 GiB host. The recorded 44.7 GiB OOM was a
  # HARDWARE-GL run, which xvfb-run removes. run_test.d's own defaultJobs()
  # would pick clamp(cpu/4,4,12) = 8 here; VIBE3D_TEST_JOBS bypasses that
  # clamp, so the number is stated in one place instead of inferred.
  VIBE3D_TEST_JOBS: 6

jobs:
  sanitizer:
    runs-on: [self-hosted, Linux, perf-fedora]
    timeout-minutes: 270
    steps:
    - uses: actions/checkout@v4
      with:
        # fetch-depth: 0 is REQUIRED, not tidiness. `tests/unit/unittest_census_gate.d`
        # guards against silently losing test coverage by walking the history
        # behind the branch point — and on a SHALLOW clone that walk is cut off
        # at a graft and returns a NUMBER instead of an error. It measured one
        # commit for a 21-commit lane. The gate refuses to run rather than
        # report a figure it cannot stand behind, which is why the sanitizer
        # lane's first complete night failed here (1 of 237 modules) rather
        # than passing with a meaningless census.
        #
        # Fetching only the branch point is NOT a substitute — the gate's own
        # message says so, because the graft is what breaks the walk, not the
        # absence of one ref. With `clean: false` the workspace persists, so
        # the full history is fetched once and refreshed incrementally after.
        fetch-depth: 0
        # Same reasoning as perf.yaml: the workspace's untracked build state is
        # the point on this runner (the nfde path-dep's C lib, .dub's
        # incremental objects). A clean would wipe libnfd.a and the build would
        # fail on a link error with no relation to anything this lane measures.
        clean: false

    - name: 'D toolchain on PATH'
      run: echo "$HOME/.local/dlang/dmd2/linux/bin64" >> "$GITHUB_PATH"

    - name: 'Restore the private tools/local symlink'
      # tools/local is a gitignored symlink into the private repo and
      # actions/checkout does not create it. Without it the fuzzing step runs
      # nothing and the night reports health — the exact shape in which the
      # perf lane once lost its whole run history. This step only tries; the
      # preflight below is what FAILS if it did not work.
      run: |
        if [ ! -e tools/local ]; then
          for cand in "$GITHUB_WORKSPACE/../vibe3d_private/tools/local" \
                      "$HOME/Code/vibe3d_private/tools/local" \
                      "$HOME/vibe3d_private/tools/local"; do
            if [ -d "$cand" ]; then ln -sfn "$cand" tools/local; break; fi
          done
        fi
        ls -ld tools/local || true

    - name: 'Preflight (fails the job, by design)'
      # As of task 2080 this ALSO checks free space on tempDir() and on
      # VIBE3D_SAN_DUB_HOME, first, before the LDC/DISPLAY/fuzzer checks: an
      # exhausted `/tmp` (32 GiB tmpfs = RAM on the host this was measured on)
      # is what turned into six unrelated red fixture tests instead of an
      # obvious "no space" refusal. `./run_test.d` carries the matching check
      # for the ordinary suite runs below.
      run: rdmd tools/sanitizer/lane.d preflight

    - name: 'Preflight: the RELEASE binary does not contain the fault injector'
      run: rdmd tools/sanitizer/lane.d preflight-release

    # ---- every LDC step first -------------------------------------------
    # Order matters and is not cosmetic. Building with LDC rewrites the nfde
    # PATH dependency's D archive (third_party/nfde/bin/libnfde.a) IN THE
    # WORKTREE — DUB_HOME does not isolate it, because a path dep builds to a
    # fixed in-tree path. run_test.d compiles its source-backed tests with
    # **dmd** against that same archive, so a dmd link after an LDC build fails
    # with `undefined reference to __asan_memcpy`, reported only as
    # "worker N failed to prepare". So: all LDC builds, then ONE restore, then
    # everything that links with dmd.
    - name: 'Build --build=check (LDC)'
      run: rdmd tools/sanitizer/lane.d build check

    - name: 'Build --build=sanitize (LDC + ASan)'
      run: rdmd tools/sanitizer/lane.d build sanitize

    - name: 'Module unittests (--build=check-unit, EXPLICIT)'
      env:
        # The census gate (task 0850) compares the tree against the point the
        # work began at. This lane runs on a SCHEDULE, and a scheduled run has
        # no such point by construction: `github.event.before` exists for a
        # push and `pull_request.base.sha` for a PR, and neither event is this
        # one. The gate's own message names `none` as the spelling for "this
        # build really has no baseline", and it is the truthful answer here
        # rather than a way to quiet it.
        #
        # Nothing is lost by saying so. ci.yaml runs the same gate on EVERY
        # push with a real branch point, so committed coverage loss is already
        # caught there, once, with a baseline that means something. Handing
        # this lane HEAD -- which is what it does with no branch point -- would
        # give a check under which "nothing committed can fail", and the gate
        # refuses that state on purpose. A second, weaker copy of a gate that
        # already runs properly elsewhere is not coverage; it is noise that
        # would eventually be silenced.
        VIBE3D_CENSUS_BRANCH_POINT: none
      id: unit
      # `dub test` DEFAULTS to --build=unittest. A bare `dub test
      # --config=tests` here would run an uninstrumented binary all night and
      # report health — the inert-measurement failure this whole task exists to
      # avoid. --config=tests is equally non-optional: a bare `dub test` builds
      # the `modeling` configuration and silently omits tests/unit/ entirely.
      run: |
        set -o pipefail
        LDC="$HOME/.local/dlang/ldc2-1.42.0-linux-x86_64/bin/ldc2"
        env -u WAYLAND_DISPLAY SDL_VIDEODRIVER=x11 DUB_HOME="$VIBE3D_SAN_DUB_HOME" \
          xvfb-run -a dub test --config=tests --build=check-unit --compiler="$LDC" 2>&1 | tee unit.log

    - name: 'Verify EVERY binary the night executes'
      # Not just ./vibe3d. dub built its own `vibe3d-test-tests` above, and
      # that binary is the one the unittest lane actually ran.
      run: |
        rdmd tools/sanitizer/lane.d verify check-unit ./vibe3d-test-tests
        rdmd tools/sanitizer/lane.d verify check      ./vibe3d-check
        rdmd tools/sanitizer/lane.d verify sanitize   ./vibe3d-sanitize

    - name: 'Restore dmd-linkable archives'
      run: rdmd tools/sanitizer/lane.d restore-dmd-archives

    # ---- everything that links with dmd ---------------------------------
    - name: 'Full test suite against the --build=check binary'
      id: check_suite
      run: |
        set -o pipefail
        rdmd tools/sanitizer/lane.d stage check
        env -u WAYLAND_DISPLAY SDL_VIDEODRIVER=x11 \
          xvfb-run -a ./run_test.d --no-build 2>&1 | tee check_suite.log

    - name: 'FFI-seam subset against the --build=sanitize binary'
      id: asan_suite
      # ASan's honest scope, measured in phase 0 and worth restating where the
      # step lives: it sees C-heap overruns and alloc/free mistakes, and it is
      # BLIND to the D GC heap (a write 400 KB past a `new int[](4)` is
      # accepted silently — druntime sub-allocates D objects inside big pools,
      # so the redzones are around the pool). So the subset that earns the run
      # time is the one that crosses into C/C++: LWO / OBJ / glTF / v3d /
      # image / subdivide.
      run: |
        set -o pipefail
        rdmd tools/sanitizer/lane.d stage sanitize
        env -u WAYLAND_DISPLAY SDL_VIDEODRIVER=x11 \
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0:abort_on_error=1:log_path=$PWD/asan-report \
          xvfb-run -a ./run_test.d --no-build \
            lwo_edge_cases lwo_multilayer lwo_roundtrip lwo_surfaces lwo_uv \
            obj_import gltf_transform native_v3d v3d_layers v3d_image_plane \
            image_commands image_cache_api morph_lwo morph_v3d weightmap_v3d \
            subdivide subdivide_smooth subpatch subpatch_move subpatch_preserve \
          2>&1 | tee asan_suite.log
        # detect_leaks=0 is permanent and deliberate: SDL / assimp / ImGui
        # allocate at startup and never free, and those are not our leaks.
        # log_path makes any report survive run_test.d's scratch cleanup.

    - name: 'Boot an instance for the fuzzer (GATING: a lane that reaches nothing is not green)'
      id: fuzz_boot
      # WHY THIS STEP EXISTS. Until 2026-08-19 the fuzz step below ran with NO
      # instance anywhere: nothing booted one, VIBE3D_BASE was never set, so
      # the fuzzer fell back to its default 127.0.0.1:8091 and every POST
      # raised ConnectionRefused. Its per-combo body catches bare `Exception`
      # and returns None, so all ~400 combos "ran", the summary reported
      # raw_failures=0, and the step exited 0 under continue-on-error. A whole
      # night of fuzzing would have reported health having exercised nothing.
      #
      # `lane.d boot` cannot serve here -- it reaps the instance in a
      # scope(exit) by design; it is a smoke test, not a supervisor.
      #
      # This step GATES while the fuzz step below stays recorded, and that
      # split is the point: "the instance was never reachable" is an
      # INFRASTRUCTURE failure and must redden, whereas "the fuzzer found
      # something" is a FINDING and is recorded deliberately (see Gate).
      #
      # Readiness is proven by a real COMMAND, not by /api/registry answering.
      # A route can serve while the main-thread bridge is wedged, and the
      # bridge is what every fuzz combo goes through.
      run: |
        set -o pipefail
        PORT=8599
        echo "VIBE3D_FUZZ_PORT=$PORT" >> "$GITHUB_ENV"
        # ./vibe3d is the --build=sanitize binary here, staged by the previous
        # step. ASAN_OPTIONS belongs on THIS process: the old fuzz step put it
        # on python3, which is not instrumented, so it reached nothing.
        env -u WAYLAND_DISPLAY SDL_VIDEODRIVER=x11 \
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0:abort_on_error=1:log_path=$PWD/asan-fuzz \
          xvfb-run -a ./vibe3d --test --http-port $PORT > fuzz-instance.log 2>&1 &
        echo "VIBE3D_FUZZ_PID=$!" >> "$GITHUB_ENV"
        # THE RETRY IS ON THE COMMAND, NOT ON /api/registry, and the run of
        # 2026-08-22 (32593076228) is why. That run waited on the registry,
        # which answered, then fired ONE command and took its reply as final:
        #
        #     [http] HTTP server starting on port 8599
        #     [http] HTTP server started on port 8599
        #     {"status":"error","message":"command handler not set"}
        #
        # The instance was healthy. The HTTP server accepts connections from
        # its own thread BEFORE app init has wired the command handler, so
        # "the port answers" and even "the registry answers" are both true in
        # a window where no command can be served. A single-shot probe that
        # lands in that window fails a lane that had nothing wrong with it,
        # and the fuzz + coverage steps below never run.
        #
        # That body no longer exists: task 1740 replaced it (and the 500 the
        # other routes gave) with a single 503 on every /api/* route, so the
        # window is now visible to a probe that reads only the status code.
        # The transcript above is kept as the record of what it looked like.
        #
        # This step's own comment already said readiness must be proven by a
        # real COMMAND rather than by a route answering; the loop simply was
        # not on the command. Now it is. The registry poll is kept as a cheap
        # first barrier so the command loop starts against a live socket
        # rather than against connection refused.
        #
        # TASK 1740 made that first barrier mean something. /api/registry is
        # now gated like every other /api/* route and answers 503 (no
        # "commands" key) until the app is wired, so this loop no longer
        # sails straight through the startup window it was written beside.
        for i in $(seq 90); do
          curl -s --noproxy '*' -m 2 "http://127.0.0.1:$PORT/api/registry" \
            | grep -q '"commands"' && break
          sleep 1
        done
        # 60 attempts against a wall clock, not against the app: a build under
        # ASan + xvfb reaches its wiring late, and the failure this replaces
        # happened ~4 s after the server bound its port.
        ok=""
        code=""
        for i in $(seq 60); do
          code=$(curl -s --noproxy '*' -m 60 -o fuzz-smoke.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:$PORT/api/command" \
            -d '{"id":"mesh.subdivide","params":{}}' || true)
          if grep -q '"ok"' fuzz-smoke.json; then ok=1; break; fi
          # TASK 1740 — THIS IS A CODE NOW, NOT A BODY. 503 is the app's one
          # "still starting" answer and the only thing worth waiting out;
          # anything else is a real refusal and waiting cannot fix it, so the
          # loop stops and the diagnostics below print the actual reply. The
          # string this used to grep for ('command handler not set') no longer
          # exists on the wire -- had it been left here, this loop would break
          # on its FIRST attempt and redden a healthy lane.
          [ "$code" = "503" ] || break
          sleep 1
        done
        [ -n "$ok" ] || {
          echo "::error::the fuzz instance never answered a command -- the fuzzer would have exercised nothing"
          echo "--- last status: ${code:-none} (503 = still wiring; anything else is a refusal) ---"
          echo "--- instance log ---"; tail -40 fuzz-instance.log || true
          echo "--- smoke reply (after $i attempt(s)) ---"; cat fuzz-smoke.json || true
          exit 1
        }
        echo "fuzz instance live on $PORT and answering commands (after $i attempt(s))"

    - name: 'Fuzz the instrumented binary (existing 13 recipes, UNCHANGED)'
      id: fuzz
      continue-on-error: true
      # The fuzzer is not widened here. It already found 17 bugs at this width;
      # pointing it at an instrumented binary for the first time IS the delta,
      # and it is the only change worth making before the instrumentation has
      # run even once. Widening the action space to the whole registry is its
      # own task (1412), deliberately not bundled.
      #
      # It runs WITHOUT xvfb: it is a pure HTTP client and needs no display.
      # The old wrapping allocated a second X server that nothing drew on.
      run: |
        set -o pipefail
        # Resolve BEFORE the pipeline, and refuse an empty answer. Inlining the
        # substitution would hand `python3 ""` to a step that carries
        # continue-on-error, i.e. it would restore the silent no-op the
        # preflight exists to prevent -- with the preflight already green,
        # because the symlink can die between the two steps.
        FUZZER="$(rdmd tools/sanitizer/lane.d fuzzer-path)"
        test -n "$FUZZER" || { echo "::error::fuzzer path did not resolve"; exit 1; }
        echo "$VIBE3D_FUZZ_PID" > "$PWD/fuzz-instance.pid"
        # --minutes became --search-minutes (task 1412): the sweep and the
        # random search now carry SEPARATE budgets, because with one shared
        # budget `sweep_complete` is a function of the clock and a timeout is
        # indistinguishable from a real coverage hole.
        #
        # --instance-pid is what turns an instance death from a silent skip
        # into a classified finding. Measured: a wedged main thread takes the
        # whole HTTP surface down, so the socket alone cannot tell a wedge from
        # a crash — only the pid can.
        VIBE3D_BASE="http://127.0.0.1:${VIBE3D_FUZZ_PORT}" \
          python3 "$FUZZER" --search-minutes 60 --out "$PWD/fuzz-out" \
            --instance-pid "$VIBE3D_FUZZ_PID" \
            --instance-log "$PWD/fuzz-instance.log" 2>&1 | tee fuzz.log

    - name: 'Coverage as a NUMBER (task 1412)'
      id: fuzz_coverage
      continue-on-error: true
      # WHY --width=recipes AND NOT THE WHOLE REGISTRY, TODAY.
      #
      # The registry-wide sweep works and was measured end to end on the lane:
      # 329 subjects, 131.66 s wall, reach 315/315. But that number is off the
      # MODELING build, and this lane runs `--build=sanitize`. The plan's own
      # precondition for putting the wide sweep in the night is a full sweep
      # timed on the INSTRUMENTED binary, and that has not been measured. So the
      # night gets the narrow width, whose wall time HAS been measured here
      # (14 subjects, 14.32 s), and the wide one waits for its own number.
      #
      # --gate=record for the FINDING (holes) only. The infrastructure clauses
      # -- floor tripped, partial sweep, reach 0, stale policy, main-thread
      # timeout, an excluded subject that accepts -- redden in BOTH modes from
      # the first night. A gate that cannot fail for a fortnight is the defect
      # this campaign keeps finding, and it is not reintroduced here.
      run: |
        set -o pipefail
        # Resolved ONCE and refused when empty, for the reason the fuzz step
        # above spells out: the symlink can die between two resolutions, and
        # this step carries continue-on-error, so an empty path would restore
        # the silent no-op with a green preflight behind it.
        FUZZER="$(rdmd tools/sanitizer/lane.d fuzzer-path)"
        test -n "$FUZZER" || { echo "::error::fuzzer path did not resolve"; exit 1; }
        ATLAS="$(dirname "$FUZZER")"
        BASE="http://127.0.0.1:${VIBE3D_FUZZ_PORT}"
        python3 "$ATLAS/registry_space.py" --base "$BASE" \
          --out "$PWD/fuzz-out/space.json" --width recipes 2>&1 | tee -a fuzz.log
        VIBE3D_BASE="$BASE" python3 "$FUZZER" \
          --out "$PWD/fuzz-out" --width recipes --space "$PWD/fuzz-out/space.json" \
          --sweep --no-search --sweep-minutes 0 \
          --instance-pid "$VIBE3D_FUZZ_PID" 2>&1 | tee -a fuzz.log
        python3 "$ATLAS/coverage_gate.py" \
          --space "$PWD/fuzz-out/space.json" \
          --coverage "$PWD/fuzz-out/coverage.json" \
          --gate record --record-since "$COVERAGE_GATE_SINCE" 2>&1 | tee -a fuzz.log

    - name: 'Did the fuzz instance survive (RECORDED: a crash here is a finding)'
      id: fuzz_alive
      if: always()
      continue-on-error: true
      # Deliberately NOT gating, and deliberately separate from fuzz_boot. An
      # instance that dies mid-run is exactly what this lane exists to catch,
      # and it is a FINDING -- the Gate's stated policy is that findings are
      # recorded on the early nights. But it must be VISIBLE: a dead instance
      # makes every remaining combo return None, and the fuzzer's own summary
      # then reports a healthy run over the corpse.
      run: |
        if curl -s --noproxy '*' -m 10 "http://127.0.0.1:${VIBE3D_FUZZ_PORT}/api/registry" \
             | grep -q '"commands"'; then
          echo "instance survived the fuzz run"
        else
          echo "::warning::the fuzz instance did NOT survive -- every combo after its death returned nothing"
          echo "--- instance log tail ---"; tail -60 fuzz-instance.log || true
          ls -la asan-fuzz.* 2>/dev/null || true
          exit 1
        fi

    - name: 'Stop the fuzz instance'
      if: always()
      run: kill "${VIBE3D_FUZZ_PID}" 2>/dev/null || true

    - name: 'Collect sanitizer reports'
      if: always()
      run: |
        {
          echo "### nightly-sanitizer"
          echo ""
          echo "| signal | outcome |"
          echo "|---|---|"
          echo "| module unittests (check-unit) | ${{ steps.unit.outcome }} |"
          echo "| full suite (check) | ${{ steps.check_suite.outcome }} |"
          echo "| FFI subset (sanitize/ASan) | ${{ steps.asan_suite.outcome }} |"
          echo "| fuzz (recorded) | ${{ steps.fuzz.outcome }} |"
          echo ""
          echo "#### sanitizer reports"
          echo '```'
          if ls asan-report.* asan-fuzz.* >/dev/null 2>&1; then
            grep -h "ERROR: AddressSanitizer" asan-report.* asan-fuzz.* | sort | uniq -c
          else
            echo "(none — no ASan report file was written)"
          fi
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sanitizer-${{ github.run_id }}
        path: |
          unit.log
          check_suite.log
          asan_suite.log
          fuzz.log
          asan-report.*
          asan-fuzz.*
          fuzz-out/
        retention-days: 90

    - name: 'Teardown — ./vibe3d must not survive this job'
      if: always()
      # The 03:30 perf nightly runs `run.d frames --no-build` against exactly
      # ./vibe3d in this same unclean workspace. An instrumented binary left
      # here is measured by it, silently. A per-buildType `targetName` would
      # have prevented the staging entirely, but is INERT on dub 1.41
      # (measured: describe reports targetName vibe3d and the build writes
      # ./vibe3d anyway), so the deletion is explicit and it is checked.
      run: rdmd tools/sanitizer/lane.d teardown

    - name: 'Gate'
      if: always()
      # Gating: the three test signals PLUS fuzz_boot. The split is the lesson
      # of 2026-08-19: "the fuzzer never reached an instance" is an
      # INFRASTRUCTURE failure and gates; "the fuzzer found something" and "the
      # instance died" are FINDINGS and stay recorded.
      # The fuzz step is RECORDED for now — the
      # instrumentation has never run a full night, and a lane that goes red on
      # its first unfamiliar finding gets switched off rather than read. Flip it
      # to gating once the finding stream is understood.
      run: |
        echo "unit=${{ steps.unit.outcome }} check=${{ steps.check_suite.outcome }} asan=${{ steps.asan_suite.outcome }} fuzz_boot=${{ steps.fuzz_boot.outcome }} fuzz=${{ steps.fuzz.outcome }} fuzz_alive=${{ steps.fuzz_alive.outcome }}"
        [ "${{ steps.unit.outcome }}" = "success" ] && \
        [ "${{ steps.check_suite.outcome }}" = "success" ] && \
        [ "${{ steps.asan_suite.outcome }}" = "success" ] && \
        [ "${{ steps.fuzz_boot.outcome }}" = "success" ]
