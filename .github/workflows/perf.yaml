name: nightly-perf

# Nightly perf measurement on the dedicated perf-fedora runner — the ONLY
# host where tools/perf/baseline.json's absolute comparison is valid (the
# baseline header is host-guarded; every other machine silently downgrades
# to invariants-only). The runner lives INSIDE the owner's graphical session
# (systemd user service, PartOf=graphical-session.target), so vibe3d renders
# through the real display/GPU — same conditions the committed baselines
# were captured under. Do not point any other job at this runner: it is a
# workstation, and a daytime build would both slow the desktop and pollute
# any concurrently-running measurement.
#
# Five signals, four of them gating:
#   1. ops absolute vs committed baseline — RECORDED ONLY for now
#      (continue-on-error): the Jun-07 baseline is knowingly stale and red
#      (see doc/tasks/backlog/0680 + the 2026-08-18 audit); re-baselining
#      before those fixes land would legitimize the debt. FLIP THIS STEP TO
#      GATING when the baseline is regenerated post-fix.
#   1b. lane health — GATING (task 1373). The composition of the ops run:
#      every row OK, every declared case present, every geometry command
#      either covered by a case or explicitly excluded with a reason. It gates
#      what (1) cannot, because (1) is a stale-baseline budget comparison and
#      this is a set of machine-stable facts. A perf case that stops working
#      used to redden nothing at all; now it reddens here.
#   2. --vs-last day-over-day gate — GATING. Any per-case kernel median
#      +20% over the previous comparable nightly fails the run. This is the
#      "new regression since yesterday" detector that stays meaningful even
#      while (1) is red with known debt. It also fails with NO VERDICT when
#      the ops run above was CONTAMINATED — a foreign vibe3d alive on this
#      workstation while the matrix measured (task 1840). Such a night is
#      recorded but never compared, in either direction: its numbers are the
#      host's contention, and a green would mean "did not check". The fix is
#      on the host, not in the code — clear the stray instance and re-run.
#   3. tools preview invariants — GATING. The cost of ONE rebuildPreview for
#      the sixteen tools that rebuild a standing preview every drag frame,
#      plus the counts that make that number trustworthy (task 1370). No
#      absolute baseline, so nothing here can be stale-red.
#   4. frames --ci counter invariants — GATING (machine-stable counters
#      only; p99/hitch budgets are recorded in the log, not gated — see
#      doc/frame_scenarios_ci_plan.md for why F-I4/GC is host-flaky).

on:
  schedule:
    - cron: '30 0 * * *'   # 03:30 MSK; build.yml's nightly (03:00 UTC) runs on ci-vm, no overlap
  workflow_dispatch:

concurrency:
  group: nightly-perf
  cancel-in-progress: false

jobs:
  perf:
    runs-on: [self-hosted, Linux, perf-fedora]
    # Raised 90 -> 240 on the owner's call (2026-08-19): they want a full
    # perf lane AND the instrumented sanitizer lane to run every night, and
    # 90 was chosen when this lane held 26 command rows and nothing else.
    #
    # This is a CEILING, not a duration. The measured scheduled run of
    # 2026-08-19 (run 32207177526) spent 375 s in the ops step -- build
    # included -- and 10 s in frames, i.e. under 7 minutes wall for the whole
    # job. The ceiling exists for a hang, not for the workload, and the
    # workload has ~34x of room before it is the binding constraint.
    #
    # The window is what bounds it, not this number: the lane fires at 00:30
    # UTC and the sanitizer lane's next fire is 19:00 UTC, so even a full
    # 240-minute stall (ending 04:30 UTC / 07:30 MSK) collides with nothing.
    # If that end time ever becomes the problem -- it is the owner's morning --
    # move the cron earlier rather than shrinking the ceiling, because a
    # ceiling that cuts a real run turns a slow lane into a red one and hides
    # the slowness behind a timeout.
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
      with:
        # No `git clean -ffdx`: the workspace's untracked build state is the
        # point on this runner — the nfde path-dep's C lib
        # (third_party/nfde/nativefiledialog-extended/out/src/libnfd.a, see
        # ci.yaml's cache-drop comment), the perf binary the frames step
        # reuses via --no-build, and .dub's incremental objects that keep
        # the nightly ldc build to seconds. Run 32168774072 failed exactly
        # on the clean: it wiped libnfd.a while dub cache-hit the frozen
        # nfde D-target and skipped the CMake preBuild → link error.
        clean: false

    # Belt to the clean:false braces: if the workspace ever IS cleaned
    # (manual wipe, fresh runner), dropping the cached nfde dub target
    # forces its preBuildCommands to regenerate the C lib. Cheap.
    - name: 'Drop cached nfde dep (force preBuild)'
      run: rm -rf ~/.dub/packages/nfde ~/.dub/cache/nfde || true

    - name: 'D toolchain on PATH'
      # The runner is a systemd user service with the user-manager's minimal
      # PATH; rdmd/dub live in the dmd2 tarball dir (run.d's perf build uses
      # its own absolute ldc2 path independently of this).
      run: echo "$HOME/.local/dlang/dmd2/linux/bin64" >> "$GITHUB_PATH"

    - name: 'Persist run history outside the workspace'
      # actions/checkout cleans untracked files (git clean -ffdx) on every
      # run, which would wipe the gitignored tools/perf/history/ — the very
      # data --vs-last and --trend live on. Keep it in $HOME and symlink in.
      run: |
        mkdir -p "$HOME/perf-history"
        rm -rf tools/perf/history
        ln -s "$HOME/perf-history" tools/perf/history

    # Task 2030 — this runner's host now also serves a companion perf job
    # from a private sibling repository (a second self-hosted runner
    # service on the SAME machine). Two perf measurements sharing one host
    # produce contention noise on both, silently — every timed step below
    # (ops/tools/frames) is wrapped in `with_perf_lock.sh`, a host-wide
    # `flock` that serializes this job's measuring window against that
    # one's. 1200s (20 min) is a WAIT-to-acquire budget, not a run budget:
    # picked well above this lane's own measured worst case (ops alone has
    # taken 375s) so an ordinary overlap waits it out rather than failing,
    # while a genuinely stuck holder still gets caught inside this job's
    # existing 240-minute ceiling instead of hanging it silently.
    - name: 'Ops matrix, absolute vs committed baseline (recorded)'
      id: ops
      continue-on-error: true
      run: |
        set -o pipefail
        env -u WAYLAND_DISPLAY SDL_VIDEODRIVER=x11 DISPLAY=:0 \
          tools/perf/lib/with_perf_lock.sh 1200 -- \
          rdmd tools/perf/run.d --n 316 2>&1 | tee ops.log

    - name: 'Day-over-day gate (--vs-last)'
      id: vslast
      run: |
        set -o pipefail
        rdmd tools/perf/run.d --vs-last 2>&1 | tee vslast.log

    - name: 'Lane health (ops rows + declared coverage)'
      id: lanehealth
      # GATING, and gating is the whole point of it (task 1373).
      #
      # The `ops` step above runs under continue-on-error and is deliberately
      # left out of the Gate, so a perf case that STOPS WORKING today reddens
      # nothing: it prints ERROR, is dropped from the history map before it is
      # written, and `--vs-last` only walks the keys of the CURRENT run, so
      # "was here yesterday, gone today" is never asked. The lane keeps paying
      # for the case and keeps reading as coverage. This step is the answer to
      # that, kept narrow enough that it can gate from day one:
      #
      #   1. some row in results.json is not OK;
      #   2. some case this binary DECLARES produced no row at all;
      #   3. some geometry command is in neither the case table nor the
      #      exclusion table (invariant L2's finding, carried in the file).
      #
      # All three are machine-stable facts about the COMPOSITION of the run —
      # a status string, a set of names, a list of command ids. None is a
      # hardware-bound budget and none has a two-month-stale baseline to be
      # wrongly red against, which is exactly the argument the `tools` step
      # below makes for gating on its first night. It does NOT bring `ops`
      # back into the gate and it does not touch baseline.json: those are the
      # other two holes, and they stay with task 1460.
      #
      # `always()`: an `ops` step that failed is precisely when this has
      # something to say.
      #
      # It is a pure read of tools/perf/results.json — no build, no vibe3d, no
      # port — so it cannot disturb the measurement it reports on. `ops`
      # deletes that file before it measures, so a crashed or timed-out `ops`
      # leaves nothing here to certify and this step says so.
      if: always()
      run: |
        set -o pipefail
        rdmd tools/perf/run.d --lane-health 2>&1 | tee lanehealth.log

    - name: 'Ops trend snapshot'
      # Runs while the latest history entry is still the ops run above (the
      # frames step below appends a frames entry, which would flip --trend's
      # comparable-with-latest filter to the frames table).
      if: always()
      run: rdmd tools/perf/run.d --trend --last 14 > trend.log 2>&1 || true

    - name: 'Tool preview cost (tools)'
      id: tools
      # `always()` for the same reason the trend step carries it: a red step
      # earlier in the job must not DELETE this lane's diagnosis. The final
      # gate still aggregates every outcome, so this changes what the log
      # contains, never what the job decides (review fix, task 1370).
      if: always()
      # AFTER the trend step, deliberately. `--vs-last` and `--trend` both key
      # on the LATEST history entry, which must still be the ops run above:
      # this step appends an entry of its own (kind "tools"), and running it
      # earlier would make vs-last decline to gate ("latest entry is not an
      # `ops` run") and flip trend's comparable-with-latest filter to this
      # lane's one-row table. Same ordering constraint the trend step's own
      # comment states about frames' append.
      #
      # GATING from day one, unlike the ops step: this lane has no absolute
      # baseline to be stale against. Every clause it checks is a machine-
      # stable COUNT — the timer fired once per driven rebuild (I8a), the
      # preview really moved the mesh (I8b), the restore/refresh decomposition
      # is one-to-one (I8c), and the lane produced the cases it was asked for
      # with zero errors (L1). Nothing here is a hardware-bound budget.
      #
      # `--n 96` is now cosmetic, not load-bearing: the history header is
      # derived from the size the case ACTUALLY ran at (`ToolCase.meshN` /
      # TOOLCASE_NMAX) rather than from this flag, so a run that forgets it
      # still files rows comparable with this one. It is kept only so the
      # printed table's "ran at its own pinned size" note stays quiet.
      # `--no-build` reuses the perf binary the ops step built (its own
      # fail-fast aborts if that binary lacks PerfProbe).
      run: |
        set -o pipefail
        env -u WAYLAND_DISPLAY SDL_VIDEODRIVER=x11 DISPLAY=:0 \
          tools/perf/lib/with_perf_lock.sh 1200 -- \
          rdmd tools/perf/run.d tools --no-build --n 96 2>&1 | tee tools.log

    - name: 'Frame scenario counter invariants (frames --ci)'
      id: frames
      # See the tools step: a red lane above must not skip this one and hide
      # what it would have said. The final gate still requires success.
      if: always()
      run: |
        set -o pipefail
        env -u WAYLAND_DISPLAY SDL_VIDEODRIVER=x11 DISPLAY=:0 \
          tools/perf/lib/with_perf_lock.sh 1200 -- \
          rdmd tools/perf/run.d frames --no-build --ci --n 316 2>&1 | tee frames.log

    - name: 'Job summary'
      if: always()
      run: |
        {
          echo "### nightly-perf"
          echo ""
          echo "| signal | outcome |"
          echo "|---|---|"
          echo "| ops absolute vs baseline (recorded) | ${{ steps.ops.outcome }} |"
          echo "| lane health: rows + declared coverage (gating) | ${{ steps.lanehealth.outcome }} |"
          echo "| day-over-day --vs-last (gating) | ${{ steps.vslast.outcome }} |"
          echo "| tools preview invariants (gating) | ${{ steps.tools.outcome }} |"
          echo "| frames --ci counters (gating) | ${{ steps.frames.outcome }} |"
          echo ""
          echo "#### lane health"
          echo '```'
          cat lanehealth.log 2>/dev/null || echo "(no output)"
          echo '```'
          echo "#### vs-last"
          echo '```'
          cat vslast.log 2>/dev/null || echo "(no output)"
          echo '```'
          echo "#### tool preview cost"
          echo '```'
          grep -A6 "=== tool preview results" tools.log 2>/dev/null || echo "(no output)"
          echo '```'
          echo "#### ops verdict"
          echo '```'
          grep -A4 "=== verdict ===" ops.log 2>/dev/null || echo "(no output)"
          echo '```'
          echo "#### trend (last 14 comparable runs)"
          echo '```'
          cat trend.log 2>/dev/null || echo "(no output)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: perf-${{ github.run_id }}
        path: |
          tools/perf/results.json
          tools/perf/frames_results.json
          tools/perf/tools_results.json
          ops.log
          vslast.log
          lanehealth.log
          tools.log
          frames.log
          trend.log
        retention-days: 90

    - name: 'Gate'
      # Mirrors ci.yaml's aggregate pattern: the job is red iff a GATING
      # signal failed. The ops step is recorded above but deliberately not
      # aggregated until the baseline is regenerated post-0680/snap fixes.
      if: always()
      run: |
        echo "ops=${{ steps.ops.outcome }} lanehealth=${{ steps.lanehealth.outcome }} vslast=${{ steps.vslast.outcome }} tools=${{ steps.tools.outcome }} frames=${{ steps.frames.outcome }}"
        [ "${{ steps.lanehealth.outcome }}" = "success" ] && \
        [ "${{ steps.vslast.outcome }}" = "success" ] && \
        [ "${{ steps.tools.outcome }}" = "success" ] && \
        [ "${{ steps.frames.outcome }}" = "success" ]
