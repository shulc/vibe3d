# Tool Properties form for the Topology Pen tool (mesh.topoPen).
#
# Same mechanism as config/forms/loopslice.yaml / smooth.yaml: the one value
# control binds to a `tool.attr mesh.topoPen <attr> ?` line — reading queries
# the tool's params(), writing dispatches the command with `?` filled in.
# Loaded at startup by source/forms.d (loadForms), auto-discovered from
# config/forms/*.yaml (source/app.d), and strict-validated against the
# Topology Pen tool's params() (validateForms) — a misspelt attr fails loud
# at boot. A matching tool form fully replaces the legacy schema panel (the
# propertyPanel.draw fallback only runs when NO form matches the active
# tool), so this form carries the tool's full visible parameter set (which,
# as of the mid-edge Split extension, is exactly this one checkbox).
#
# `splitMiddle` is the ONLY attr in mesh.topoPen.params() (grep params() in
# source/tools/edit/topology_pen.d for the authoritative name/type) — the
# "Split at the Middle" option (doc/topopen_midedge_split_plan.md
# Deliverable #4). It forces the mid-edge Split gesture's insert fraction to
# exactly 0.5 (the edge midpoint) instead of the release click's own
# position along the edge. Default OFF, sticky across gestures.

forms:
  - id: topopen.main
    label: Topology Pen
    showLabel: false
    whenTool:
      - mesh.topoPen
    category: toolprops/main
    ordinal: 150.50
    rows:
      - { control: "tool.attr mesh.topoPen splitMiddle ?", label: "Split at the Middle" }
